<!doctype html>
<!-- Open Graph card, 1200x630. Render: open in a 1200x630 viewport and screenshot. -->
<html><head><meta charset="utf-8"><style>

  .bg{position:absolute;inset:0;background:url(raw/feature-onthego.webp) right center/auto 100% no-repeat}

<div class="bg"></div><div class="fade"></div>
<div class="pad">
  <div class="brand"><img src="../icon/icon-1024.png" alt="">StayAwake</div>
  <div class="kick">Closed-lid Mac, on the go</div>
  <h1>Agents keep working.<br><em>Laptop in your bag.</em></h1>

</div>
