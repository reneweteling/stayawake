name: Bug report
description: Something in StayAwake does not work as it should
labels: [bug]
body:
  - type: dropdown
    id: channel
    attributes:
      label: Which StayAwake do you run?
      options:
        - GitHub release
        - Built from source
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: StayAwake version
      description: Settings, About tab
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.1"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which area?
      options:
        - Menu bar icon or popover
        - Safety rules
        - Schedule
        - Helper or approval
        - Sensors
        - Settings
        - Other
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead. If a rule tripped or did not trip when it should have, name the rule and paste the event log lines.
    validations:
      required: true
