name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'design/**'
      - '**.md'

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

jobs:

  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install pnpm dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Compute next version (dry-run)
        id: version
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # semantic-release --dry-run prints either:
          #   "The next release version is X.Y.Z"         (new release)
          #   "There are no relevant changes..."           (no release)
          # It does NOT write package.json (we don't use the @semantic-release/npm plugin),
          # so we must parse the log instead of reading package.json.
          set -o pipefail
          DRY_LOG="$(pnpm semantic-release --dry-run --no-ci 2>&1 | tee /dev/stderr || true)"

          # `|| true` because grep exits 1 when there is no new release, and
          # this shell runs with -e -o pipefail; the fallback below handles it.
          NEXT_VERSION="$(printf '%s\n' "$DRY_LOG" \
            | grep -oE 'next release version is [0-9]+\.[0-9]+\.[0-9]+' \
            | awk '{print $NF}' \
            | tail -1 || true)"

          if [[ -z "$NEXT_VERSION" ]]; then
            echo "::warning::semantic-release dry-run did not produce a next version; falling back to latest git tag"
            LATEST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
            NEXT_VERSION="${LATEST_TAG#v}"
          fi

          echo "Resolved next version: $NEXT_VERSION"
          echo "version=$NEXT_VERSION" >> $GITHUB_OUTPUT

  build:
    name: Build
    runs-on: macos-latest
    needs: version
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # This workflow only runs on release pushes to main, so an unsigned
      # build must never be shipped: fail here instead of falling back.
      - name: Require signing secrets
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          missing=0
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD APPLE_ID APPLE_APP_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required secret $name"
              missing=1
            fi
          done
          exit $missing

      - name: Run tests
        shell: bash
        run: swift test

      - name: Set version in Info.plist
        shell: bash
        run: ./scripts/update-version.sh "${{ needs.version.outputs.version }}"

      - name: Import Developer ID certificate
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build StayAwake.app
        shell: bash
        env:
          SIGN_IDENTITY: Developer ID Application
        run: ./scripts/build.sh

      # Notarize the app itself first and staple the ticket to it, so the
      # app keeps working offline once it is copied out of the disk image.
      - name: Notarize and staple the app
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ND82KXRD2Q
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/StayAwake.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple build/StayAwake.app
          xcrun stapler validate build/StayAwake.app
          rm -f "$RUNNER_TEMP/notarize.zip"

      - name: Build disk image
        shell: bash
        env:
          SIGN_IDENTITY: Developer ID Application
        run: ./scripts/make-dmg.sh

      - name: Notarize and staple the disk image
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ND82KXRD2Q
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit build/StayAwake.dmg \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple build/StayAwake.dmg
          xcrun stapler validate build/StayAwake.dmg
          echo "Disk image size: $(du -sh build/StayAwake.dmg | cut -f1)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: stayawake-macos-v${{ needs.version.outputs.version }}
          path: build/StayAwake.dmg
          retention-days: 1

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [version, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Clean build directory
        shell: bash
        run: rm -rf build/

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: stayawake-macos-v${{ needs.version.outputs.version }}
          path: build/

      - name: Configure Git
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run semantic-release
        shell: bash
        run: pnpm semantic-release
